name: CI

on:
  push:
    branches:
      - "experiment/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"
      - name: Install locked dependencies
        run: uv sync --frozen --group dev --python "${{ matrix.python-version }}"
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Pytest
        run: uv run --no-sync pytest
      - name: Build distributions
        run: uv build

  appworld:
    name: AppWorld / Python 3.13
    runs-on: ubuntu-latest
    env:
      APPWORLD_ROOT: ${{ github.workspace }}/.local/appworld
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Enable Git LFS
        run: git lfs install
      - name: Cache AppWorld data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .local/appworld
          key: appworld-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: appworld-${{ runner.os }}-
      - name: Install Python
        run: uv python install 3.13
      - name: Install locked benchmark dependencies
        run: uv sync --frozen --group dev --extra benchmark --python 3.13
      - name: Install AppWorld payloads
        run: uv run --no-sync appworld install
      - name: Download AppWorld task data
        run: uv run --no-sync appworld download data
      - name: Verify official AppWorld tasks
        run: uv run --no-sync appworld verify tasks

  secret-scan:
    name: Secret scan / full history
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
