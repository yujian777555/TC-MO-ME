[project]
name = "tc-mo-me"
version = "0.1.0"
description = "Reproducible infrastructure for TC-MO-ME experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<2.14",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "openai>=1.0,<3",
]
benchmark = [
    "appworld==0.2.0.dev0",
    "fastapi>=0.110,<0.151",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
appworld = { git = "https://github.com/stonybrooknlp/appworld.git", rev = "42b5bcf3cd334fee33f0c37c02070a9f5807add5" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
