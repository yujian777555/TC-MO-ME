schema_version: 1
enabled: true
run_id: e0-mock-smoke
experiment_id: e0-mock-smoke
model:
  enabled: true
  adapter: mock
  model_id: e0-deterministic-mock
  model_version: mock-v1
  price_id: explicit-zero-price-for-mock-only
  input_price_per_million: "0"
  output_price_per_million: "0"
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 5
  max_retries: 0
environment:
  kind: mock
  instruction: Produce one deterministic code action and finish after mock verification.
runner:
  max_steps: 8
  timeout_seconds: 10
  process_isolation: true
  results_root: results
limits:
  max_episodes: 1
  max_model_calls: 8
tasks:
  - task_id: mock-task-0
    task_family: mock
    seed: 0
genome:
  schema_version: "0.1"
  system_prompt: Follow the requested node format and solve only the supplied mock task.
  planning_policy:
    strategy: decompose
    max_steps: 8
  code_generation_policy:
    language: python
    response_format: strict_json_code_only
  verification_policy:
    require_checks: true
    structured_decision: finish_or_continue
  workflow_graph:
    entry_id: plan
    exit_ids: [verify]
    max_nodes: 8
    nodes:
      - {id: plan, type: planner, config: {}}
      - {id: generate, type: generator, config: {}}
      - {id: execute, type: executor, config: {}}
      - {id: verify, type: verifier, config: {}}
    edges:
      - {source: plan, target: generate}
      - {source: generate, target: execute}
      - {source: execute, target: verify}
  identity:
    genome_id: e0-mock-control
    origin: manual_non_evolved
  lineage: {}
