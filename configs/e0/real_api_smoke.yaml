schema_version: 1
enabled: false
auto_execute: false
run_id: e0-real-api-smoke
experiment_id: e0-real-api-smoke
model:
  enabled: false
  adapter: openai_compatible
  model_id: null
  price_id: null
  input_price_per_million: null
  output_price_per_million: null
  base_url: null
  api_key_env: null
  model_seed_supported: false
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 30
  max_retries: 0
required_user_provided_fields:
  - model.model_id
  - model.price_id
  - model.input_price_per_million
  - model.output_price_per_million
  - model.base_url
  - model.api_key_env
limits:
  max_episodes: 6
  max_model_calls: 40
  max_api_cost_usd: "2.00"
environment:
  kind: appworld
  root: .local/appworld
  execution_timeout_seconds: 30
runner:
  max_steps: 8
  timeout_seconds: 120
  process_isolation: true
notes:
  - No credentials or real provider prices are stored in this file.
  - api_key_env names a user-managed environment variable; its value must never be committed.
  - The CLI does not auto-execute this configuration or construct a real API adapter.
